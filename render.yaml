services:
  - type: web
    name: st-stitches-empire
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    runtime: python-3.12.10
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./tailor.db
