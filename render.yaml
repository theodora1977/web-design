services:
  - type: web
    name: st-stitches-empire
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:${PORT:-8000} --workers 2 -k uvicorn.workers.UvicornWorker app:app
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./tailor.db
