{% extends 'admin_base.html' %}
{% block content %}
  <div class="admin-card">
    <h1>Manage Images</h1>
    <a class="admin-button" href="/admin/dashboard">Back to Dashboard</a>
  </div>

  <div class="admin-card">
    <table class="admin-table">
      <tr><th>ID</th><th>Image</th><th>Title</th><th>Category</th><th>Price</th><th>Actions</th></tr>
      {% for img in images %}
      <tr>
          <td>{{ img.id }}</td>
          <td><img src="/uploads/{{ img.image }}" alt="{{ img.title }}" width="120"></td>
          <td>{{ img.title }}</td>
          <td>{{ img.category }}</td>
          <td>{{ img.price }}</td>
          <td>
              <a class="admin-button" href="/admin/images/edit/{{ img.id }}">Edit</a>
              <form action="/admin/images/delete/{{ img.id }}" method="post" style="display:inline">
                  <button class="admin-button" type="submit" onclick="return confirm('Delete this image?')">Delete</button>
              </form>
          </td>
      </tr>
      {% endfor %}
    </table>
  </div>
{% endblock %}
