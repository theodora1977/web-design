{% extends 'admin_base.html' %}
{% block content %}
  <div class="admin-card">
    <h1>Manage Services</h1>
    <a class="admin-button" href="/admin/dashboard">Back to Dashboard</a>
  </div>

  <div class="admin-card">
    <h2>Add Service</h2>
    <form action="/admin/services/add" method="post">
      <label>Name:<input type="text" name="name" required></label>
      <label>Description:<textarea name="description"></textarea></label>
      <label>Price:<input type="number" step="0.01" name="price" required></label>
      <button class="admin-button" type="submit">Add</button>
    </form>
  </div>

  <div class="admin-card">
    <h2>Existing Services</h2>
    <table class="admin-table">
      <tr><th>ID</th><th>Name</th><th>Description</th><th>Price</th><th>Actions</th></tr>
      {% for s in services %}
      <tr>
        <td>{{ s.id }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.description }}</td>
        <td>{{ s.price }}</td>
        <td>
          <a class="admin-button" href="/admin/services/edit/{{ s.id }}">Edit</a>
          <form action="/admin/services/delete/{{ s.id }}" method="post" style="display:inline">
            <button class="admin-button" type="submit" onclick="return confirm('Delete this service?')">Delete</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </table>
  </div>
{% endblock %}
