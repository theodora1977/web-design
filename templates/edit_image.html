<!DOCTYPE html>
<html>
<head>
    <title>Edit Image - ST STITCHES EMPIRE</title>
</head>
<body>
    <h1>Edit Image</h1>
    <a href="/admin/images">Back to Images</a>
    <form action="/admin/images/edit/{{ image.id }}" method="post" enctype="multipart/form-data">
        <label>Title:<br><input type="text" name="title" value="{{ image.title }}" required></label><br><br>
        <label>Category:<br><input type="text" name="category" value="{{ image.category }}" required></label><br><br>
        <label>Price:<br><input type="number" step="0.01" name="price" value="{{ image.price }}" required></label><br><br>
        <label>Description:<br><textarea name="description">{{ image.description }}</textarea></label><br><br>
        <label>Replace Image (optional):<br><input type="file" name="image" accept="image/*"></label><br><br>
        <button type="submit">Save</button>
    </form>
</body>
</html>
