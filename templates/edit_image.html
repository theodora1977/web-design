{% extends 'admin_base.html' %}
{% block content %}
  <div class="admin-card">
    <h1>Edit Image</h1>
    <a class="admin-button" href="/admin/images">Back to Images</a>
  </div>

  <div class="admin-card">
    <form action="/admin/images/edit/{{ image.id }}" method="post" enctype="multipart/form-data">
      <label>Title:<input type="text" name="title" value="{{ image.title }}" required></label>
      <label>Category:<input type="text" name="category" value="{{ image.category }}" required></label>
      <label>Price:<input type="number" step="0.01" name="price" value="{{ image.price }}" required></label>
      <label>Description:<textarea name="description">{{ image.description }}</textarea></label>
      <label>Replace Image (optional):<input type="file" name="image" accept="image/*"></label>
      <button class="admin-button" type="submit">Save</button>
    </form>
  </div>
{% endblock %}
