<!DOCTYPE html>
<html>
<head>
    <title>Edit Service - ST STITCHES EMPIRE</title>
</head>
<body>
    <h1>Edit Service</h1>
    <a href="/admin/services">Back to Services</a>
    <form action="/admin/services/edit/{{ service.id }}" method="post">
        <label>Name:<br><input type="text" name="name" value="{{ service.name }}" required></label><br>
        <label>Description:<br><textarea name="description">{{ service.description }}</textarea></label><br>
        <label>Price:<br><input type="number" step="0.01" name="price" value="{{ service.price }}" required></label><br>
        <button type="submit">Save</button>
    </form>
</body>
</html>
