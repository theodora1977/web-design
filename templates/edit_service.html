{% extends 'admin_base.html' %}
{% block content %}
  <div class="admin-card">
    <h1>Edit Service</h1>
    <a class="admin-button" href="/admin/services">Back to Services</a>
  </div>

  <div class="admin-card">
    <form action="/admin/services/edit/{{ service.id }}" method="post">
      <label>Name:<input type="text" name="name" value="{{ service.name }}" required></label>
      <label>Description:<textarea name="description">{{ service.description }}</textarea></label>
      <label>Price:<input type="number" step="0.01" name="price" value="{{ service.price }}" required></label>
      <button class="admin-button" type="submit">Save</button>
    </form>
  </div>
{% endblock %}
